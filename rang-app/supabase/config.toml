# A string used to distinguish different Supabase projects on the same host.
project_id = "rang-healthcare"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_role = "anon"

[edge_runtime]
enabled = true
port = 54324
inspector_port = 8083

[functions.ingest]
verify_jwt = false

[functions.status]
verify_jwt = false
